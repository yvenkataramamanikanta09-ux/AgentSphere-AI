[project]
name = "agentsphere-backend"
version = "0.3.0"
description = "AgentSphere AI: document metadata API with PostgreSQL persistence"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn>=0.34,<1.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.15,<2.0",
    "argon2-cffi>=25.1,<26.0",
    "email-validator>=2.2,<3.0",
    "python-multipart (>=0.0.22,<0.1)",
    "pypdf (>=6.12,<7)",
    "python-docx (>=1.2,<2)",
    "markdown-it-py (>=4,<5)",
]

[tool.poetry]
packages = [{ include = "agentsphere", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10.0"
httpx = ">=0.28,<1.0"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = ">=0.9,<1.0"

# Standalone local inference is optional; the metadata API needs none of these.
[tool.poetry.group.embeddings]
optional = true

[tool.poetry.group.embeddings.dependencies]
transformers = "5.20.2"
torch = { version = "2.14.1+cpu", source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: integration tests requiring a dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
