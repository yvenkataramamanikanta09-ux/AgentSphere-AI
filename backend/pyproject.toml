[project]
name = "agentsphere-backend"
version = "0.1.0"
description = "AgentSphere AI Module 1: document metadata validation API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn>=0.34,<1.0",
]

[tool.poetry]
packages = [{ include = "agentsphere", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10.0"
httpx = ">=0.28,<1.0"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = ">=0.9,<1.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
